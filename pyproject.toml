[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm-studio"
version = "0.1.0"
description = "HMM topology editor, constrained fit engine, and visualizer."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Robin Denis"}]
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "hmmlearn>=0.3,<0.4",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "typer[all]>=0.12",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24.0",
]

[project.scripts]
hmm-fit = "hmm_core.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
