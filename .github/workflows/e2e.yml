name: E2E

# Playwright suite. Currently `workflow_dispatch` only — a PR-time enable
# attempt (commit 5b20bf6, then re-disabled here) surfaced 4 pre-existing
# UI/test drifts that must be cleaned up before E2E can gate merges:
#
#   * e2e/tests/academy.spec.ts:53 — `locator('h1').toContainText("Markov chains")`
#     hits strict-mode because the page has 2 h1s (sidebar "hmm-studio" + lesson
#     title). Switch to `locator('h1').nth(1)` or `getByRole("heading", ...)`.
#   * e2e/tests/golden-path.spec.ts:39 — `getByText(/24 rows/i)` no longer
#     present; the data preview UI must have been refactored to show row count
#     differently. Update the locator to match current Preview component output.
#   * e2e/tests/warehouse.spec.ts:57 — `csvBadges.toHaveCount(3)` receives 4.
#     The committed warehouse fixture (`e2e/fixtures/warehouse/`) has one more
#     CSV than the test expects. Either trim the fixture or bump the count.
#   * e2e/tests/tour-recording.spec.ts:75 — `Launch fit` button remains disabled.
#     Some upstream form state is no longer auto-filled by the tour script.
#     Likely missing `await page.getByLabel("Seed").fill("42")` or similar.
#
# Track in a dedicated cleanup commit; once green, restore the `push` +
# `pull_request` triggers below.
#
# TODO(e2e-cleanup): re-enable PR triggers after the 4 drifts above are fixed.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install hmm-studio (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Build frontend
        run: python scripts/build_frontend.py

      - name: Install e2e deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start hmm-studio (background)
        env:
          # Point the studio at the committed warehouse fixture so the
          # warehouse.spec.ts E2E tests (Phase B.10c) see a populated sidebar.
          HMM_STUDIO_WAREHOUSE_PATH: ${{ github.workspace }}/e2e/fixtures/warehouse
        run: |
          hmm-studio --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/hmm-studio.pid
          # Wait for /health
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "studio is up"
              break
            fi
            sleep 2
          done

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop hmm-studio
        if: always()
        run: |
          if [ -f /tmp/hmm-studio.pid ]; then
            kill $(cat /tmp/hmm-studio.pid) || true
          fi
