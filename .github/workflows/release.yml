name: Release

# Triggers on a tag like v1.0.0 — publishes to PyPI via Trusted Publishing.
# Requires the repo to be configured at https://pypi.org/manage/account/publishing/
# (no API token in secrets needed — uses OIDC).

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: src/hmm_studio/frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend dist into server static
        run: |
          mkdir -p src/hmm_studio/server/static
          cp -r src/hmm_studio/frontend/dist/. src/hmm_studio/server/static/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing via OIDC — no PYPI_API_TOKEN needed
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/hmm-studio
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
